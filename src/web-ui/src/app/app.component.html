<div class="container" style="height: 100%">
  @if (isMobile) {
    <app-mobile-header></app-mobile-header>
  } @else {
    <app-desktop-header class="desktop-header"></app-desktop-header>
    <div class="side-menu-wrapper">
      <app-side-menu></app-side-menu>
      <ng-container [ngTemplateOutlet]="footer"></ng-container>
    </div>
  }
  <div class="router-wrapper">
    <div class="router-section">
      <div class="content">
        <router-outlet></router-outlet>
      </div>
      @if (isMobile) {
        <ng-container [ngTemplateOutlet]="footer"></ng-container>
      }
    </div>
  </div>
</div>
<app-aswg-spinner [fullScreen]="true"></app-aswg-spinner>
<app-aswg-download-snackbar-dongle></app-aswg-download-snackbar-dongle>
<ng-template #footer>
  <footer class="footer">
    <span class="version">Version: {{ version() }}</span>
    <span class="copyright">&copy; ASWG 2026</span>
  </footer>
</ng-template>
