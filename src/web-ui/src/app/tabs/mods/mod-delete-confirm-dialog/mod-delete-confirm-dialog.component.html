<h1 mat-dialog-title>Confirm Deletion</h1>
<mat-dialog-content>Are you sure you want to delete this mod?</mat-dialog-content>
<mat-dialog-actions>
  <button matButton="filled" [mat-dialog-close]="true">Yes</button>
  <button matButton="filled" mat-dialog-close cdkFocusInitial>No</button>
</mat-dialog-actions>
