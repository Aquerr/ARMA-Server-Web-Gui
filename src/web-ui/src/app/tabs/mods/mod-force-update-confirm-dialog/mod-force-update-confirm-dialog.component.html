<h1 mat-dialog-title>Confirm Force Update</h1>
<div mat-dialog-content>Are you sure you want to force update this mod?</div>
<div mat-dialog-actions>
  <button matButton="filled" [mat-dialog-close]="true">Confirm</button>
  <button matButton="outlined" mat-dialog-close cdkFocusInitial>Cancel</button>
</div>
