<h1 mat-dialog-title>Enter preset name</h1>
<div mat-dialog-content>
  <form [formGroup]="form">
    <mat-form-field>
      <mat-label>Preset Name</mat-label>
      <input
        formControlName="modPresetName"
        matInput
        type="text"
        (keydown)="onEnterClick($event)"
        />
      @if (form.controls.modPresetName.errors?.['required']) {
        <mat-error>This field is required</mat-error>
      }
      </mat-form-field>
    </form>
  </div>
  <div mat-dialog-actions>
    <button matButton="filled" (click)="closeDialog()">Create</button>
    <button matButton="filled" mat-dialog-close cdkFocusInitial>Cancel</button>
  </div>
