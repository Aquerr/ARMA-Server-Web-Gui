<h1 mat-dialog-title>Confirm Deletion</h1>
<div mat-dialog-content>Are you sure you want to delete this difficulty profile?</div>
<div mat-dialog-actions>
  <button matButton="filled" class="btn-danger" [mat-dialog-close]="true">Delete</button>
  <button matButton="outlined" mat-dialog-close cdkFocusInitial>Cancel</button>
</div>
